# =====================================================================
# JADWAL EKSEKUSI SPESIFIK - Target HG680P (2026)
# =====================================================================
name: Scheduled builds Jobs

on:
  schedule:
    - cron: '0 18 1 9 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  job-hg680p:
    name: Job HG680P (all-hg680p)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 1 9 *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trigger Builds.yml - HG680P
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +'%Y')" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Bukan tahun 2026. Membatalkan eksekusi otomatis."
            exit 0
          fi

          gh workflow run Builds.yml \
            -f release_branch="openwrt:25.12.5" \
            -f rootfs_size="1024" \
            -f target="all-hg680p" \
            -f tunnel="all-tunnel-v2" \
            -f clean="true"
